job:
  project: dreamdojo
  group: pick_trocar_headcam_real_mix
  name: g1_pick_trocar_headcam_2b_real_mix

checkpoint:
  save_iter: 500
  load_path: /localhome/local-yunl/DreamDojo/outputs/train/dreamdojo/pick_trocar_headcam/g1_pick_trocar_headcam_2b/checkpoints/iter_000010000/
  load_training_state: false
  strict_resume: false

trainer:
  max_iter: 3000
  max_val_iter: 100
  grad_accum_iter: 1
  callbacks:
    every_n_sample_reg:
      every_n: 500
      fps: 5
    every_n_sample_ema:
      every_n: 500
      fps: 5

optimizer:
  lr: 0.00004

model_parallel:
  context_parallel_size: 1

model:
  config:
    state_t: 4  # 1 + 12 // 4
    net:
      action_dim: 384
      temporal_compression_ratio: 4
      num_action_per_chunk: 12
      zero_init_action_embedder: false

dataloader_train:
  batch_size: 4
  dataset:
    num_frames: 13
    dataset_path:
      - /localhome/local-yunl/DreamDojo/datasets/g1_pick_trocar_200_headcam_train
      - /localhome/local-yunl/DreamDojo/datasets/g1_pick_trocar_real_train_headcam
      - /localhome/local-yunl/DreamDojo/datasets/g1_pick_trocar_real_train_fail_contact_headcam
    dataset_mixing_weights: [0.8, 0.1, 0.1]
    data_split: full
    single_base_index: false
    deterministic_uniform_sampling: false

dataloader_val:
  batch_size: 1
  dataset:
    num_frames: 13
    dataset_path:
      - /localhome/local-yunl/DreamDojo/datasets/g1_pick_trocar_200_headcam_val
      - /localhome/local-yunl/DreamDojo/datasets/g1_pick_trocar_real_val_headcam
    data_split: full
    single_base_index: false
    deterministic_uniform_sampling: true
